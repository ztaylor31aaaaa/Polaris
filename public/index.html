<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#090b10"><meta name="description" content="Polaris — games, tools and your workspace.">
<title>Polaris</title><link rel="stylesheet" href="/styles.css">
</head>
<body>
<div class="app-shell">
  <aside class="sidebar" id="sidebar" aria-label="Polaris navigation">
    <a class="rail-home active" href="#home" aria-label="Home" title="Home">✦</a>
    <nav class="rail-nav" aria-label="Main navigation">
      <a href="#browser" data-page="browser" class="rail-link" title="Web browser" aria-label="Web browser"><span>◎</span></a>
      <a href="#discover" data-page="discover" class="rail-link" title="Discover" aria-label="Discover"><span>⌕</span></a>
      <a href="#library" data-page="library" class="rail-link" title="My library" aria-label="My library"><span>▦</span></a>
      <a href="#toolkit" data-page="toolkit" class="rail-link" title="Toolkit" aria-label="Toolkit"><span>⌘</span></a>
      <a href="#ai" data-page="ai" class="rail-link" title="AI workspace" aria-label="AI workspace"><span>✧</span></a>
      <a href="#changelog" data-page="changelog" class="rail-link" title="Changelog" aria-label="Changelog"><span>◷</span></a>
      <a href="#feedback" data-page="feedback" class="rail-link" title="Feedback" aria-label="Feedback"><span>✉</span></a>
    </nav>
    <div class="rail-bottom">
      <a href="#settings" data-page="settings" class="rail-link" title="Settings" aria-label="Settings"><span>⚙</span></a>
      <span class="rail-status" id="status-dot" title="API status"></span>
    </div>
  </aside>
  <div class="main-area">
    <header class="browserbar">
      <div class="addressbar-shell"><span class="address-lock">●</span><span class="address-prefix">polaris://web</span><form id="global-address-form" class="global-address-form"><input id="global-address" type="text" autocomplete="off" spellcheck="false" placeholder="Search or enter a website address…" aria-label="Search or enter a website address"></form></div>
      <div class="web-quick-actions"><button id="web-back" type="button" title="Back" aria-label="Back">←</button><button id="web-forward" type="button" title="Forward" aria-label="Forward">→</button><button id="web-reload" type="button" title="Reload" aria-label="Reload">↻</button></div>
      <div class="top-actions"><span class="connection-label" id="api-pill">Connecting</span><button class="menu-toggle" id="menu-toggle" aria-label="Open navigation">☰</button></div>
    </header>
    <main id="page-content" class="page-content"><div class="loading">Initialising Polaris…</div></main>
    <footer class="footer"><span>POLARIS</span><span id="footer-version">Application workspace</span></footer>
  </div>
</div>
<div class="toast-area" id="toast-area" aria-live="polite"></div>
<script type="module" src="/app.js"></script>
</body></html>
